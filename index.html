<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TapOnThat makes NFC-powered tap cards for Canadian businesses. Tap the card, open your booking page instantly — no app required."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TapOnThat — Tap. Connect. Done.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the real path if we arrived here via the 404.html SPA redirect
      // (see public/404.html) before React Router mounts.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', location.pathname.replace(/\/$/, '') + redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
